<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudLearn LMS - Cloud Learner Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

  <div class="auth-page">
    <!-- Top Right Theme Toggle -->
    <div class="auth-theme-toggle">
      <button class="theme-pill-btn" id="themeToggleBtn" type="button">
        <span class="theme-indicator-icon"></span>
        <span>Theme</span>
      </button>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo">
          <span>Cloud<span class="orange">Learn</span> <span class="blue">LMS</span></span>
        </div>
        <p class="brand-subtitle" id="authSubtitle">Cloud Learner Management System</p>
      </div>

      <!-- Sign In Form -->
      <form id="signInForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary" id="btnSignIn">
          <span>Sign In</span>
        </button>

        <!-- Demo Credentials Helper Box -->
        <div class="demo-box" style="margin-top: 24px;">
          <h4>⚡ Quick Demo Credentials (Click to Autofill)</h4>
          <div class="demo-chips">
            <div class="demo-chip" onclick="quickFill('admin@lms.com', 'admin123')">
              <span class="demo-role" style="color: var(--badge-admin);">Admin</span>
              <span class="demo-creds">admin@lms.com / admin123</span>
            </div>
            <div class="demo-chip" onclick="quickFill('sarah@lms.com', 'teacher123')">
              <span class="demo-role" style="color: var(--blue-light);">Teacher (Facilitator)</span>
              <span class="demo-creds">sarah@lms.com / teacher123</span>
            </div>
            <div class="demo-chip" onclick="quickFill('emily@lms.com', 'student123')">
              <span class="demo-role" style="color: var(--badge-student);">Student</span>
              <span class="demo-creds">emily@lms.com / student123</span>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="javascript/store.js"></script>
  <script src="javascript/app.js"></script>
  <script>
    // Quick credential filler
    function quickFill(email, pwd) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pwd;
      showToast('Credentials filled for ' + email, 'info');
    }

    const signInForm = document.getElementById('signInForm');

    // Handle Login
    signInForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const user = CloudStore.getUserByEmail(email);
      if (!user) {
        showToast('No user account found with that email address.', 'error');
        return;
      }

      if (user.password !== password) {
        showToast('Invalid password. Please verify your credentials.', 'error');
        return;
      }

      // Save session
      CloudStore.setCurrentUser(user);
      showToast(`Welcome back, ${user.name}! Redirecting...`, 'success');

      setTimeout(() => {
        if (user.role === 'admin') {
          window.location.href = 'pages/admin.html';
        } else if (user.role === 'teacher') {
          window.location.href = 'pages/facilitator.html';
        } else {
          window.location.href = 'pages/student.html';
        }
      }, 700);
    });
  </script>
</body>
</html>
